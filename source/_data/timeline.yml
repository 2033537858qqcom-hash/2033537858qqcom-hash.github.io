      - IMG_20260725_183731_131_2026-07-31_02-39-14_037.webp
    excerpts:
      - id: "37493429759"
        label: 来杭州快一个月
        lines:
          - 来杭州快一个月了
          - 实习也有了一周
          - 这里充斥着一股向上的气息
          - 每个人都在自己的路上跑着
          - 或快或慢 都在向着前方
        comment:
          lines:
            - 是春也是夏
            - 这里的风很大
            - 这里的雨很多
            - 这里的梦还是那样暖
      - id: "37377043985"
        lines:
          - 我是一个爱拍照的人
          - 雨是温柔的 它总是紧紧的拥抱
          - 雨是记忆的 它总用不同方式存储时间
      - id: "37821644208"
        lines:
          - 毕业之际
          - 只有着无限畅享  遨游万里
          - 只能默道  匆匆那年
