# 人生长廊 · 时间轴（数据驱动，渲染见 scripts/timeline-page.js）
# 原则：只写随笔 / 摄影 / 文章里真实存在的内容；节选句子必须能在 shuoshuo.yml 原文里找到（构建时会校验，找不到会告警）。
# - photos：source/img/photography/ 下已有的 webp 文件名
# - excerpts：id 对应 shuoshuo.yml；lines 为原文里的短句（逐行必须是原文子串）；comment.lines 为同一条下「作者的评论」里的短句（来自 shuoshuo-comments.yml，同样校验）
# - posts：source/_posts 下的文件名（不含 .md），标题/链接/日期自动取文章本身
# - song：必须是该年随笔里实际用过的「配乐」
# 已刻意跳过：2026-10-01 姥姥相关动态，以及低落/私人的随笔与评论。

intro: 把你的随笔、摄影、重要文章按年份放在同一条时间轴上——一年一章，各自带着当年的照片、几句话、和一首歌。
tagline: 它不是人生履历，而是留下每一年真实的生活痕迹。

years:
  - year: 2023
    theme: 校园
    summary: 这一年的照片从九月开始：柳条、云、落日、红色的飞檐，镜头多半朝着天空和树。随笔要到十二月才开始写，写的是平常的一天，也写了这一年从高中到大学的变化。
    data_note: 随笔只有 12 月的 8 条，所以这一章偏短；照片反而是这一年最完整的部分。
    photos:
      - IMG_20230915_065224_90_2026-07-31_02-39-12_924.webp
      - IMG_20231123_154531_84_2026-07-31_02-39-12_798.webp
      - IMG_20231202_094403_107_2026-07-31_02-39-13_336.webp
      - IMG_20231202_100228_63_2026-07-31_02-39-12_232.webp
      - IMG_20231202_112015_61_2026-07-31_02-39-12_207.webp
      - IMG_20231202_164044_3_2026-07-31_02-39-11_593.webp
    excerpts:
      - id: "24556285884"
        label: 年末回看这一年
        lines:
          - 由高中到大学
          - 由紧张到轻松
          - 由单一生活到多姿多彩
      - id: "24559305340"
        lines:
          - 中午，半节体育，嗯，2023年体育彻底结课
          - 下午，睡了5小时，醒后，舒服，真舒服
      - id: "24553286133"
        lines:
          - 真是平凡的一天，无聊至极，but，觅到了安眠曲
    posts: []
    song:
      title: 泥巴
      artist: 乔浚丞
      url: https://music.163.com/song?id=2095788526
      from: "24556285884"
      why: 2023 年只有两首配乐各用过一次；《泥巴》配在年末回看这一年的那条随笔里，最贴「这一年」。备选：《失重催眠曲》（淑清）。

  - year: 2024
    theme: 大学生活
    summary: 宿舍里听歌、过年时的雪和鞭炮、看过就打卡的电影，春天的花、银杏、竹林，还有秋天清晨的雾和霜。日子不总是明亮，但这些小景被一一留了下来。
    photos:
      - IMG_20240319_171142_33_2026-07-31_02-39-11_896.webp
      - IMG_20240412_092125_116_2026-07-31_02-39-13_553.webp
      - IMG_20240709_115703_88_2026-07-31_02-39-12_874.webp
      - IMG_20240715_163207_74_2026-07-31_02-39-12_487.webp
      - IMG_20241001_174155_39_2026-07-31_02-39-11_991.webp
      - IMG_20241001_174314_53_2026-07-31_02-39-12_132.webp
    excerpts:
      - id: "24723231274"
        lines:
          - 在宿舍听歌
          - 感觉挺不一样的
          - 多了许多感触
          - 但挺享受这种感觉
      - id: "24660853670"
        lines:
          - 雪在飘着，鞭炮响着，人们笑着
          - 也许年就在眼前吧
      - id: "24879837336"
        lines:
          - 有时恰好的好运会对情绪有着奇效
          - 可那也是开心过了
          - 舒服
      - id: "30124840394"
        lines:
          - 日出
          - 清晨的雾
          - 田地的霜
          - 叽喳叽喳
    posts: []
    song:
      title: Enola
      artist: Otto A Totland
      url: https://music.163.com/song?id=522352207
      from: "30124840394"
      why: 2024 年的配乐每首都只用过一次，没有「最常用」；《Enola》配在那条清晨日出的短诗里，雾、霜、鸟叫，和这一年的照片气质最接近。

  - year: 2025
    theme: 学习
    summary: 这一年的随笔里有读完一本收藏已久的书、课堂上透过窗看毕业的人群、秋天楼下暖洋洋的风；照片里有海、礁石、海鸥和芦苇，也有十一月的金黄树叶。
    photos:
      - IMG_20250405_060915_19_2026-07-31_02-39-11_759.webp
      - IMG_20250405_072101_48_2026-07-31_02-39-12_081.webp
      - IMG_20250405_151117_20_2026-07-31_02-39-11_771.webp
      - IMG_20250405_151832_8_2026-07-31_02-39-11_642.webp
      - IMG_20251129_160758_11_2026-07-31_02-39-11_676.webp
      - IMG_20251129_161142_6_2026-07-31_02-39-11_623.webp
    excerpts:
      - id: "30379729889"
        label: 读后有感
        lines:
          - 书并不是那种读完就感觉震撼的，而是需要细品，仔细一回味，感触颇深
      - id: "30465206743"
        lines:
          - 我认为书虽不可以增强一个人的外在气质
          - 可它却丰富了心
      - id: "30500402925"
        lines:
          - 又是一年毕业季
          - 我透窗望去
          - 这就是青春，它不会缺席
      - id: "37063569986"
        lines:
          - 阳光也终于打破了那阴暗的气氛
          - 一阵风抚来
          - 吹在身上暖洋洋的
    posts: []
    song:
      title: Finding It There
      artist: Goldmund
      url: https://music.163.com/song?id=18057482
      from: "30777563893"
      why: 2025 年配乐里用得最多的一首（共 3 次：2 月、9 月、10 月）。次选《一生有你》（水木年华，2 次，配在读书和毕业季两条里）。

  - year: 2026
    theme: 实习与生活
    summary: 三月来到杭州，四月开始实习，随笔里写这里「向上的气息」。也有夜里的雨、暖起来的春天、和毕业之际的几句话。这一年的照片多是天空、湖和落日。
    photos:
      - IMG_20260328_153721_34_2026-07-31_02-39-11_910.webp
      - IMG_20260725_172559_121_2026-07-31_02-39-13_729.webp
      - IMG_20260725_173737_123_2026-07-31_02-39-13_820.webp
