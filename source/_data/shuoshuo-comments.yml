  content: "明明渴望着被人喜欢，却又害怕别人真的走近。\n似乎这些年过去，自己也并没有改变多少。\n有时候觉得成长就是不断认识自己的过程，可认识得越多，反而越不知道该如何面对自己。\n以前总觉得未来有着无限的可能。\n如今倒是越来越习惯在开始之前，先考虑那些可能发生的不好的结果。"
