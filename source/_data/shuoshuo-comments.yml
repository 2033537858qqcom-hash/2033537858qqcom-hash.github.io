  content: "一些人早已离开，一些习惯却始终没有改变。\n也不知道以后还会不会遇见喜欢的人。\n若是真的遇见了，希望那时的自己能够勇敢一些吧。\n至少，不要再让一个真心想见自己的人，在雨里等那么久。\n写到这里，突然有些不知道该说些什么。\n已经凌晨了。\n室友应该都睡了。\n窗外很安静。\n罢了，就这样吧。"
