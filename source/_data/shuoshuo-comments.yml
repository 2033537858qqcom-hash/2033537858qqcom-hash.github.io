  content: "心中想谈，身体怯懦。\n有时也会幻想，倘若以后真的遇见一个喜欢自己的女孩，大概会很开心吧。\n可紧接着，又会害怕。\n害怕自己做得不够好，害怕无法回应别人的期待，害怕某一天，又像当年那样，因为自己的懦弱而伤害一个愿意靠近自己的人。\n甚至会觉得，自己没有那个资格。\n说来真是矛盾。"
