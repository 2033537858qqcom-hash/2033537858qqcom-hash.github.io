- content: |
    **所感所想**

    不知从何写起 也不知写些什么
    可最近的自己催促着 需要写些内容

    阴雨天持续了两周
    粘稠的空气附在周围 包裹着每个人
    只有听觉与触觉才能知道他们的存在

    ![雨夜漫步](/img/moments/rain-night-walk.webp)

    漫步雨中 轮胎与柏油摩擦 哗...
    声音由远到近 由近到远
    路过天桥 树下的鸟儿 也在追赶着什么
    路过断桥 向下望去 全部覆盖着诙谐
    溪水 绿葱 点缀的波荡 在灯光下是那般死寂

    我撑着伞 还在小路走着
    四面八方都会有风 时而逆风时而顺风
    也许是披着外套 后背渗出水珠
    风也在这时停止摇摆 褪去衣物 继续撑伞

    道路旁的水渍趴在一旁 我们离得很近
    映射着伞下的我 邯郸学步 只能这般形容
    就同平常的雨天一样 快步走着
    硕大的雨滴从叶上滴落 砸在头顶...

    夜晚 雨声渐渐被蝉鸣替换
    规律的鸣叫 又回到酷热的季节
    嗡嗡的空调 一升一降 奏着清凉奏着盛夏
    拉开窗帘 没有星空明月 泥垢糊满视野
    窗沿缝隙还有着雨水 也许日出时它也会消失
    最后的泥垢会证明存在的痕迹

    夜深了
