- content: |
    我终将死亡，
    在群星闪耀的夜晚，
    请将我埋葬。
    不要问我从何处来，
    来处遥隔千万里，
    不要问我往哪里去，
    前途无尽路茫茫，
    不要为我悲伤，不要为我哭泣，
    终有一日，
    春风拂过，
    枯木上会开出鲜艳的花，
    你一定要来看看我啊，
    当那一天来临，
    我的墓碑上会有翠鸟张开翅膀，
    撒下一片阳光。
    当那一天来临，
    请带上我的双眼，
    穿越亿万光年的漫漫长河，
    抵达宇宙的尽头，
    你会看到那颗黯淡的蓝点，
    在此处，
    请将我的灵魂放逐。
    如果你要问，
    这是哪儿啊？
    遥望一亿五千万平方公里的辽阔土地，
    我会告诉你啊，
    这是我的家园。
                  －－－《死在火星上》
    比起南京那部，情节上差些意思
    也可能是许久没有看小说了
    自己的情感已经严重缺失了
    结局还是蛮不错的
  date: 2026-06-22 00:14:00
  tags:
    - 随笔
    - 夜
    - 观感
    - 季节
    - 长文

