- content: |
    欲买桂花酒，终不似，少年游
    过了今天也许高考生就解放了
    我望着角落蛛网  一圈又一圈
    天有些小冷
    当年高考前一天也是这样的
    那天晚上下着小雨 一阵一阵淅淅沥沥
    怀着忐忑  听着白噪音 喝了安神液
    还是失眠了  只记得当时已是三点
    当天早晨  天格外晴  好似要好起来
    当天晚上  天格外热  好似一切完了 睡的很舒服
    隔日早晨  恰逢同学  一番交心
    隔日黄昏  同平常般  放下纸笔
    回去途中  天格外红  但一切都完了
    风穿过行人  车辆  同学  家人  重重刺进眼瞳
    可是一切都结束了
    同平常一般  没有旅途  有的只是耳旁嗡嗡风扇声
    之后经历了一些惭愧落魄之事
    房间时常黑暗  进食排泄  不分昼夜
    ...
    我常常走在夜晚的公园
    这里没有人气  夏日清爽  风在这里才是风
    林子里有着  蝉声 呱声 ~
    走在池塘边  手扶着栅栏  闻着鱼腥
    ...
    我悄悄又拿走一包架子上的辣条
    撕开包装  辛辣鼾咸  欲罢不能
    身旁的猫凑了凑鞋  看了看四周  又刹一包洒向底
    “哎呦，自己吃就行了，还给...”
    ...
    坐在椅子上  盘着腿  正事黄昏
    盯着电脑中的文字  滑轮  点击
    耳边听着《尽头》 闻着好像是凉拌粉丝
    “吃饭啦...”，咔咔声，《葬王之路...》
    ...
    外面的风  穿过窗纱  没了冷清  只有风度
    蛛网缩成一团
    角落的蜘蛛  好似见惯  又开始了一圈又一圈
    
    —— 配乐：最后的句号 / 小新
  date: 2026-06-09 00:42:00
  tags:
    - 随笔
    - 雨
    - 夜
    - 回忆
    - 季节
    - 配乐
    - 长文

