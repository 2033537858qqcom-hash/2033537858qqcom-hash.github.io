    梦到了高中女同学（醒后挺懊悔，忘谁了）
    地点是在学校里（那教室像极了小学的教室有点破有点怀旧）
    感觉天还是挺暗挺灰的（但又好像是夏天的时候，因为好像有那刺眼的阳光，梦里的人好像穿着短袖）
    时间貌似是下午吧像是三四点的样子
    我和那女生说了几句话（忘什么了）
    然后走了，又见到了一个没见过的女生（好吧记不住什么样了）
    中间什么的忘完了（烦）
    最后吧那什么又梦见了初中的物理老师（她人挺好的，对我也很好在初三的时候）
    然后又梦见一个不认识的老师（也忘了）
    我好像干了什么（烦）
    最后拿到了一根像甘蔗的东西（一根挺长的什么吃的）
    好像自己分成了三份还是两份
    自己好像是在那门口不知道是前门还是后门
    一根给了那个不认识的老师
    她笑了
