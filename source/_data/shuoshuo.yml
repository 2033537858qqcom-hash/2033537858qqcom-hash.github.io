- content: |
    气温相较于前日有所回暖
    阳光也终于打破了那阴暗的气氛
    中午，楼下拿外卖时
    瞥见楼旁那片草地在光下映射出油绿与生命
    外卖找了半天，忽的，一阵风抚来
    吹在身上暖洋洋的
    再回去路上，同学都举起手机
    我也望去
    不知什么品种的树
    可知那脆黄的叶子随风飘荡
    更有着一些在光的照射下愈发金灿
    此刻，我也想拿起手机拍去
    有一阵风吹来，还是暖洋洋的
    我犹豫了一下
    还是算了吧
    我只是抬头望着
    ...
    回到楼下那片绿色更加油亮
    到了楼上，透过窗
    金黄一地，人来人往
    风也透过窗
    可吹在身上却有一丝刺骨
    
