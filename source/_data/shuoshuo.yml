- content: |
    本在很累的一天现在却没有一丝困意
    躺了许久许久  应该有着3 4小时
    也不知什么时候开始自己的睡眠质量就很差
    刚来杭州？刚上大学？
    我记得应该是高中的时候吧
    我不是一个聪明的人  没有什么悟性  记忆力还差
    那时的自己还很“勤奋” （现在就是一个）
    说是勤奋  不过没有朋友的可怜虫罢了
    于是应该在高二或者高三的时候
    我注意到了班中有那种非常努力进步很大的
    跑题了...
    其实自己本身在那时就没什么朋友
    除了厕所 吃饭 几乎一直在位置上
    这种情况应该是从小学就开始的
    可能是幼时家庭  也可能是刚转学  被老师针对
    同学欺负  我忘记是因为打闹还是什么
    门牙牙齿直接被撞松了
    又跑题了...
    我也学着她们  更为尤甚（当时自己走读，她们住校）
    白天听不懂的  晚上听网课
    可能当时对知识的补充些许兴奋 成为了一种习惯
    开始到11点半左右就休息了 后来到1点左右
    那段时间  可能是着了魔 怎么也睡不着
    就托父母买了  安神口服液  其实那段时间挺希望感冒的  吃了药后可以睡的舒服些
    到了大学后  作息什么的  都不一样
    开始还可以忍一忍什么的
    后来耳塞什么的...
    最近可能是有些焦虑吧
    已经到了不吃褪黑素睡不着的情况
    周末熬到4点还没有困意  赶紧吃了些
    你问我为什么一直活在过去
    因为现在真的是太苦了
    不是身体上   是精神上
    天气  工作  找工作  房租  吃饭  ...
    不理解杭州能潮湿成这个地步
    出了空调屋  戴的眼镜直接起雾😓
    过了半小时  吃了两个还是没有困意
    失眠歌单都快放一整遍了
    世界就是一个巨大的棺材
    人们每天都在练习死去和醒来
    比起现实我还是更喜欢梦中
    因为他们光怪陆离
    就好像不存在一样
    现在有些困倦了
    也许是外面的雨滴声  也许是空调音 说不定是失眠曲子
    但我知道  一会儿  我又可以离开这个世界
    
    —— 配乐：shizukana umi / 松田光由
  date: 2026-06-29 23:30:00
