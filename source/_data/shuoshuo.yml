- content: |
    自我感觉
    自己处于一个病态的状态
    病，可能就是病了
    即是感冒
    更多的是心病
    总感觉自己心中一直压抑着
    我感觉“他们”一直在心房上
    我想了解他们，可最后连他们是什么都不清楚
    可他们已经把我压的喘不出气来
    想过流泪，可未能如愿
    自己真怪，但感觉更疯
    态，可能是想法改变
    更多的是三观以及人生观的渐变
    今天，抖音刷到了一条：
    “你和别人在一起，很舒服，那是别人更加优秀”
    ——————————
    记忆的碎片，不断的闪过
    我想仔细看看
    可……
    我常在想：活着的意义
    小时候，貌似没想过那么深奥的问题，总想着快点过去每一天，想着爸爸妈妈，想着他们不要再离开我，想着姥姥姥爷会不会还留着零食给自己，想着弟弟，会不会听话，想着爸爸妈妈会不会再吵架，可那时还小，什么都做不了
    小学初中，可能是因为叛逆，青春期，亦或是家庭的原因，活着是为了自己，活着是为了学习，为了让父母过的更好，为了让家庭和睦，为了自己的未来，那时也有了一些能力，可玩性终归大于心性，没做出什么改变
    现在，可能是见识的增长，人心的体会吧，还有一些事情的经历，自己好似，一同机械，再没了对未知的期待，就亦是新事物也不过了了一撇，都在为我说：培养个爱好，我也想啊，可到底是什么，我受不了苦，我也会生闷气，也会冷暴力，是，一切虽然……但，哎，自己……
    
    —— 配乐：Windy Hill / 羽肿
