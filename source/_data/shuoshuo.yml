- content: |
    18岁，你读了大学。
    20岁，你大二结束，开始悔恨
    自己前两年幼稚的行为
    于是开始努力
    22岁你大学毕业了，却发现找不到一份令自己满意的工作
    26岁，你看着身边的人都结了婚婚礼的份子钱逐年递增
    春节回家，父母从带你串亲戚变成了带你去见相亲对象
    见了十几个姑娘
    你每次都觉得和那个她比差了一点
    28岁那年，你遇到了一个和你遭遇差不多的姑娘你们有一搭没——搭的聊着
    她说：你还不错
    你喝了一口可乐说：你也是
    你还不确定喜不喜欢她
    双方家长就已经摆好了订婚宴
    结婚的前一—周，你和朋友出去喝酒
    你说，不想结婚
    朋友说，你啊，就是想太多。谁不是这么过来的？
    29岁，你们终于结了婚
    婚礼办的不大不小，朋友来的不多不少攒了几年想要去实现理想的钱
    搭在了这一场百人的私人庙会上
    婚礼进行到中间
    司仪带着标准的商业化微笑
    对着台下的亲朋喊道
    要不要让他们亲一个！
    台下那些人跟着一起起哄
    不知道为什么
    你简简单单的亲了——口
    俩人恢复到了——开始的站位
    你小声说了一句：我爱你
    那个昨天还看不惯你倒腾模型的新娘愣了一下说：我也爱你
    你不确定她是不是对你说的
    就像你不确定是不是对她说的——样婚礼结束后，并没有你想象的浪漫
    你听着外屋的新娘一—笔一笔的算着份子钱想着不过才两年，怎么就变成这样了
    想着想着，洞房夜就睡着了
    30岁，她怀孕了
    辞掉了工作，在家养胎
    你在公司逐渐有了点地位手里管着十来个人
    独立负责一个项目
    结婚前陪嫁的那辆20万左右的车也变成了你—一个人的独享
    电话那头都是抱怨与委屈但你不能争辩什么了谁让她怀了你的孩子在这一刻
    不论是她的父母还是你的父母都无条件的站在这一边
    31岁，孩子落地了
    前前后后连孕检带住院费花了10万块钱
    不过无所谓
    你看着你的孩子，怎么看怎么喜欢高兴的仿佛这是你的新生
    32岁，这是人生最不愿意重复的一年平均睡眠3小时孩子每一个小时都要闹腾一次第二天拖着睡不醒的眼睛去上班
    老板说你上班不干活
    回家媳妇说你不干活
    你想了半天不明白，那谁干活呢？
    那辆开了3年的车
    成为了你真正的家
    你不在抱怨路上拥堵的交通
    再多堵一会
    回到家，你关了发动机
    在车上点了一根烟
    车前是功名利禄，车尾是柴米油盐
    35岁你因为身体越来越差
    晋升的速度也越来越缓慢
    那天下班，媳妇告诉你
    孩子要上幼儿园了
    双语的一一个月3000
    你皱了皱眉头，那边就已经不耐烦了
