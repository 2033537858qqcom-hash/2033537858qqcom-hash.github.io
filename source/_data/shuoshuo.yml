- content: |
    算是观后由感吧
    题材方面应该是穿越青春方面的
    故事是同其余的青春片类似
    不过正合我意
    不知是女主还是背景亦或音乐
    片中湾湾97年很像大陆的10年左右
    一切都很相像唉（可能是当时的记忆犹新吧）
    并且整个片中洋溢着一种很特别的味道
    嗯...其实我一直在想到底是什么
    应该是汗水，激情，时代发展，青春...
    他们糅杂在一起
    让我欲罢不能
    片中围绕着张雨生的歌来叙述的
    说来也惭愧我好像只了解过他的几首歌
    片也围绕着 梦想
    人始于梦想 追于梦想 终于梦想
    片中是她不够努力吗，是她不够热爱吗
    可是在现实中还不是放弃了，她缺少才华
    他一直想当一名厨师，时间拂去了一切
    虽然最后他们都进行了改变
    可毕竟是影片
    97年的湾湾经济飞升，也使得他们能自由畅想自己的一切
    片中97年的学生像日本一样有着浓厚的活力与青春
    写到这里我也忘记为什么要写下这些
    可能就是对影片中的那个她的向往吧
    我很佩服他
    现在的网上总是嘴嗨
    他做到了，若是我，回到过去遇见她
    我会像他这样一般吗
    不会，她同她很像，简直就是一个模子刻出来
    我刚看到时简直不敢相信
    就算同之前有了很多的改变
    可永远改不掉内心深处的一切
    也许最终的结局也是同现在这般
    片中的一切都是那么美好
    写到这里其实自己已经不知道在写些什么了
    还想写些什么
    可是割裂感太强了
    就这吧
    送你三朵花，一夜一朵花
    夜深了
    带我去月球
    我陪着花一起凋落
    
    —— 配乐：带我去月球 / 张雨生
