- content: |
    《大地的谎言》，一部出色心理悬疑恐怖小说，该书集恐怖、灵异、悬疑、推理于一体，为读者带来了一场惊惧盛宴。荒凉漫长的戈壁滩上，一座与世隔离的监狱，昏暗而又漫长的甬道，油灯下的鬼魅绰影，无处不在的老舜……
         该书以主角曾通，候风，狱长三个人物为主要叙事对象，在一方“鬼狱”中，去探究逃出生天的秘密。
          鹘山监狱，犹如一个真实的微缩世界，没有任何现代话设施的监狱，没有刻意的看守，也没有防御措施，无论什么身份的人，罪犯也好，在职人员也罢，都想从这个地方逃离，却怎么也逃不出去，这是一个有鬼的监狱。人性与理性的对决，诡异与智慧的较量，谎言与真相的辩别没日没夜的上演，这一切都被一双无形的大手操纵着。 黑暗之渊，没有尽头的谎言，谁与我与共?  在这里，每个人都站在自己的立场讲述看到的事实，编造着属于自己的谎言，当这些“事实”和“谎言”结合到一起后，真相就会变得晦暗不明，真假是非已然难辨。这种类似于罗生门的设定令人惊悚，比鬼更可怕的永远是人心。
        监狱里究竟有没有鬼？这是很多人发自内心的疑问。老舜，一个在书中不曾真正现显，却又无处不在的角色，也是令每个人讳忌莫深、恐惧难言的东西。每当有人妄图越狱或有越狱想法时，老舜便会出现，他也是全书中最为诡异的存在。这也是小僧的一大特色，鬼的概念是若隐若现的，而真正的恐怖存在于人的意识。
       在我看来，老舜有三种说法。祂是一种意象，代表着权力和秩序，每当有人妄图逃离，就是在挑战秩序权威，结果不言而喻。二则“老舜”是长年在监狱中饱受精神压迫者的集体意识，而曾通独立于集体意识之外，未曾陷入这场“谎言”之中，自然而然也成为寄托对象，只有老舜才能走出监狱，所以曾通便是老舜。三则，老舜就是灵异，就是鬼的化身。
         小僧，爱好恐怖灵异的老书虫们，大概都知道这位大佬吧。他的小说最精绝的地方，在于所谓的灵异都是很抽象的、朦胧的，具有很强的心理暗示性，初时不觉惊悚，待到书读至深，已是如春风化雨，寒彻骨髓荒推荐 #拯救书荒
  date: 2025-05-11 01:58:00
  tags:
    - 随笔
    - 雨
    - 夜
    - 观感
    - 季节
    - 长文

- content: |
    所以时间的参照物是什么呢
    躺在床上，床帘半落
    向上望去
    灯光掺着阳光，散出一丝凄凉
    思绪不由得拉倒儿时
    那时没什么烦恼无忧无虑
    只想着“玩”
    天晴，床被在楼顶暴晒
    躺在床板，也是望着上方
    没有那灯光，阳光透进
    只当舒坦，不一会儿就进入梦中
    在当醒来，躺在暖暖的床被
    再次向上望去，只剩一片漆黑
    可掀开被子又是蹦蹦跳跳
    －－－－－
    那时也是这般天气
    同村中伙伴到处串
    不一会儿，他们就趁家里午睡偷偷跑出
    成群结队，叽叽喳喳，好是热闹
    他们来到枯坑中，好似要发现大陆般
    你跳我跳，只听哗一声，有一人绊倒在泥坑
    哈哈哈，呜呜呜...
    最后都按下了静音，回去怎么...
    －－－－－
    ：哇，这就是吊带床嘛
    ：我奶弄的，躺上可舒服了
    ：嗯...嗯，我想试试，但我害怕...
    :   试呗，他们在堂屋里吃西瓜闲聊呢，你吃西瓜吗，我给你那一片去
    :不了，我吃好几天了，那...那我就试试了
    :哇，跟荡秋千一样，就是有些紧
    ...
    :大娘，我们走了，拜拜
    －－－－
    时间的参考物只有一段段回忆
    
    —— 配乐：老街 / 李荣浩
