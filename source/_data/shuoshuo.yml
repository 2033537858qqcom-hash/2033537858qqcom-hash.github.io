- content: |
    夜色正沉，风在高楼边缘打着旋儿。
    你抱着腿，蜷成一团，坐在天台的角落。目光越过钢筋与玻璃的森林，落向远处闪烁的灯火。
    
    灯光里，好像藏着过去的时光：儿时的玩伴、无忧的笑声，模糊却温热。
    低头一望，街上人群熙熙攘攘，仿佛你也是其中的一员，走走停停，说着不知名的故事。
    抬头望去，乌云缓缓游走，像是来自遥远的地方，又要驶向未知的彼岸。
    假山的轮廓在夜色里若隐若现，像一幅静默的画卷。
    
    风有点冷，你却想起一间温暖的小屋：灯光柔和，空气里带着木香，仿佛只要一转身，就能推开那扇门。
    
    于是你就这样坐着，时间静静溜走，心却走过了无数条路。
    
    —— 配乐：Stepping On The Rainy Street / Daydream
  date: 2025-08-18 11:42:00
  tags:
    - 随笔
    - 夜
    - 配乐

- content: |
    潮是过去她爱的，她珍藏的那些信可以看出那只是过去，她的一句我要证明没有你我可以活得很好，充分体现文姬对潮的喜欢已经成为历史，根本不及欧阳。
    从文姬留给欧阳字条称谓的改变就可以看出她爱上欧阳了。最后所谓的一番对潮爱的宣言不过是为了欺瞒欧阳她自己的病情罢了，只是为了欧阳不要痛苦。这才是爱啊，只有爱一个人才会这么在乎一个人。最后那一抹笑是她生命中最后力量化成的，为了不给所爱的人负担，牺牲了自己最后的气力。
    文姬或许笨了些，只有这样笨些的女孩儿，才会人见人爱吧。
    
    —— 配乐：기억이 머물던 곳 / July
  date: 2025-07-02 04:43:00
