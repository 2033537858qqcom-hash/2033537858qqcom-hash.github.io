- content: |
    **所感所想**
    
    不知从何写起 也不知写些什么
    可最近的自己催促着 需要写些内容
    
    阴雨天持续了两周
    粘稠的空气附在周围 包裹着每个人
    只有听觉与触觉才能知道他们的存在
    
    ![雨夜漫步](/img/moments/rain-night-walk.webp)
    
    漫步雨中 轮胎与柏油摩擦 哗...
    声音由远到近 由近到远
    路过天桥 树下的鸟儿 也在追赶着什么
    路过断桥 向下望去 全部覆盖着诙谐
    溪水 绿葱 点缀的波荡 在灯光下是那般死寂
    
    我撑着伞 还在小路走着
    四面八方都会有风 时而逆风时而顺风
    也许是披着外套 后背渗出水珠
    风也在这时停止摇摆 褪去衣物 继续撑伞
    
    道路旁的水渍趴在一旁 我们离得很近
    映射着伞下的我 邯郸学步 只能这般形容
    就同平常的雨天一样 快步走着
    硕大的雨滴从叶上滴落 砸在头顶...
    
    夜晚 雨声渐渐被蝉鸣替换
    规律的鸣叫 又回到酷热的季节
    嗡嗡的空调 一升一降 奏着清凉奏着盛夏
    拉开窗帘 没有星空明月 泥垢糊满视野
    窗沿缝隙还有着雨水 也许日出时它也会消失
    最后的泥垢会证明存在的痕迹
    
    夜深了
  date: 2026-07-22 01:15:00
  tags:
    - 随笔
    - 雨

- content: |
    若十年前的你，看到现在的你会说些什么呢？
    22    十年前也就是12     也就是六年级
    现在正是暑假  自己失业  前途一片迷茫
    那时也是暑假  自己已经去了外地参加了一场考试
    没考上   不久后又去县城里的一中考试
    还是没考上   不知道是被打还是被骂  哭的很痛
    一天中午   趁着家长午睡
    我站在楼上看着下面   咬着牙 心里暗自发誓...
    若做不到就...
    他看到现在的我  一定会疑惑  颓废消沉阴暗
    为什么还会在他还会出现他眼前
    他不知道  在之后他没有忍住诱惑  自己颓废了
    他努力了  可有些事情是努力做不到的
    他坚持  可坚持也是一门天赋  他并没有天赋
    他或许站在楼顶看着我  嘶吼着  哭泣着
    也许那时他会接受不了
    可一旦入夜  他思考后他会理解
    但理解并不能说明什么
    他可能还会在那个楼顶等着我
    问其缘由  我告诉了他
    他可能会哭的撕心裂肺  可我什么都做不到
    他还在那里哭着  声音渐渐嘶哑  变成了哽咽
    最后  他回到家中  躺在床上睡了过去
    第二天  他同周围孩子一样...
    终归到底  他还是孩子  告诉他又有什么用
    ...
    
    —— 配乐：Dear anemone, / Chouchou
  date: 2026-07-14 01:24:00
  tags:
    - 随笔
    - 夜
    - 回忆
