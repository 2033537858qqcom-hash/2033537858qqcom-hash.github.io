- content: |
    我好像回到了大概高中或初中的时候也可能是小学，当然也可能是大学应该是大学，我弟在玩他自己的电脑，这是梦的背景是棕黄色，我好像在梦里睡着了，在那个梦里，我弟变成两个，是不同时期的两个人，一个是大学的还有一个是幼儿园的，此时背景色是胶片黑色，那个大学的好像是在电脑上下载什么游戏，然后我又在梦里好像是成为了什么什么学生（这里记得不太清），但是好像那老师有问题（不正常），之后梦又回到我和我两个不同时期的弟那里，我大学的那个时期的弟在睡觉，那两个都在睡觉，我们躺在一起，大学的那个拉我的被子，然后那个幼儿园时期的开始闹，我们打了起来，他开始不断的变换时期和我打，之后梦一直重复，没有摆脱我们打架，并在那期间我有过一两次梦回到第一个梦那里，他电脑中病毒了，之后有个东西从他电脑里跑了出来，我想要追上去，梦又回到了第二个梦里，我还是和他在打，并且我开始打不过了，之后我在这两个梦里来回变换，那个东西跑到我的屋里，之后我大声喊了我妈几声，最后醒了
    ------
    是的是被惊醒的，可真的有趣
    PS：网上借的图
    愿今夜有个好梦(๑°3°๑)
