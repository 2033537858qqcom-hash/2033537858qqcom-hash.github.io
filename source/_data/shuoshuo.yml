    “不要因为别人都在交卷自己就乱写答案”
    挺有感触的
    但随风逐流外
    自己根本就找不到未来
    也许徘徊会不会更好呢
    ………………
    可能是那彭彭的炮声
    可能是自己的改变
    可能是更多的欢愉
    可能是更多的孤寂
    今年我很舒适✧٩(ˊωˋ*)و✧
    但孤独又仿佛更加严重了
    除夕夜，和发小妹妹他们走在那路边
    也许是自己
    他们投来欢快
    可自己总是格格不入
    也许自己只会扫兴
    在那晚在妹妹家吃饭
    她坐在我旁边，哦，在前天，因不想喝酒也和她坐在一起
    聊了许多
    我说她变活泼了
    她说是你变活泼了  之前你总是很冷 ，总……
    我……
    吃饭时，跟她说了许多，许多自己的烦恼，自己的问题，自己的遗憾，自己的疑惑
    她说了许多，也对我感觉挺……
    也算是快11点时，喝酒的回了家，和对象放烟花的回了家
    最后自己走在那无人的路上，时不时一声噗嗯✺
    走在那还没化完的雪上，自己感到无比的孤独
    噗嗯✺，转瞬即逝，是啊转瞬即逝……
    今天是初一，新年快乐
    今天，自己也算是又跨完一年
    在回老家的路上晕车吐的难受，真是上吐下泻
    今年没叫我们跟他们去祭祖，感觉有点别扭
    今天和发小们玩得很舒适，感觉有了小时乐趣
    今天妹妹好像没跟我们一起吃饭，不太对劲
    今天回到家睡了一下午，挺舒服的
    今天弟弟的朋友来家吃饭，家里人在桌上聊的很开心
    今天吃完饭后刷抖音看见妹妹说了他父亲认为她不行不理解她，在评论区看到了许多关心和旧友
    今天也许就是这样过去了
    是啊，耳边还响着噗嗯✺
    
