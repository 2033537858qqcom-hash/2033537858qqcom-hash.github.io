- content: |
    很多的时候不是时间无趣
    而是自己提不起兴趣
    莫名的烦躁
    不切实际的幻想
    脑中的计划
    过去，现在，未来
    思考个不停
    无限的内耗
    无人诉说，说了又如何，又不是自我
    每日的流水线
    无规律的意外
    总是逃避
    试图麻痹，可总是那么清醒
    为什么
    我不明白，这意义何在
    我不懂，为什么别人那么快乐
    我就藏在阴暗角落，苟着身躯，慢慢的只能爬行
    可现在爬不动了，我想淋着雨，吹着刺骨的寒风，在那种意识慢慢消失完成自己的一生
    也许，也不用那般复杂，嘎吱一下也未尝不是一种解脱
    我疯了，是心中，外表的沉默，已经逐渐的掩盖不住内部的馊气
    我无药可救了，他人的劝解关心被我扭解成闲言碎语，人皮已经不能掩盖
    我还在坚持什么，不知道
    每天都在想“意思”，我不懂，我真的不懂
    梦是避风港，我不能了解其中种种
    我渴望抓住这根稻草，尽管疲惫不已
    又是新的一天，又开始了一天的挣扎
    
    —— 配乐：ki / hideyuki hashimoto
