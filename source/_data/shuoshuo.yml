    算了，今天是睡不着了
    听到这首歌，以我多年听歌的经验这歌不适合助眠
    但听到这歌想起了小学时候（在外的时候）
    那时是在荆州上的（由于父亲在那里跑车）
    那时好像是刚上幼儿园大班（一直在老家上）
    好像是夏天，那天去谁家（忘叫什么了）玩回来后，好像是姥姥还是姥爷（在老家上学由他们照顾）告诉我：“你爸明天接你去那边”
    那时顿时慌了，真的，因为自己跟姥姥姥爷他们时间比父母还久，并且对父母观念不深，哭了一天
    之后第二天就被我父亲接走了，挺害怕他的（现在也是）
    当时坐的是大巴（第一次做），好像是下午到了服务区，他问我了饿不饿，然后就下车去给我买吃的了，那时好像还下着雨，自己就在车上等了好久好久，因为在路上已经有过到服务区的经历，知道车要走了，可他还没回来，当时就慌了，在来之前姥姥说：“你爸在外面很辛苦呢，主要是之前你们俩个人你妈不能照顾，你弟还小，就把你留在家”（真的当时不懂什么意思，现在懂了，当然姥姥姥爷他们对我更好，在老家的时候吧，自己在他们那住了五六年，之后因为父亲一个人在车上忙不过来，母亲也就跟着他（在自己上小学一年级的时候），于是把姥姥叫到了荆州来照顾我们俩，在荆州一年级后回到了家里小县城里上，因为教材不同自己又读了一年级，姥姥也随之来照顾我们俩，一直到三四年级吧，说实话想到这有点😞，就感觉挺对不起姥姥姥爷的，家里人都对自己期望高，可终究辜负了他们，现在姥姥得了糖尿病在老家帮着照顾大舅的孩子，姥爷在外地打工，而自己……，哎……）
    那时车已经开始动了起来，自己就侧着脸靠在窗户上看外面还没他，泪就流下来了，车已经移动了起来，还没看见他，可也就挺神奇的在自己向左看的时候看见他拿着装着鸡腿还是汉堡的塑料袋递给我，说：“怎么哭了，是谁说你了吗？”我没回答，这一刻记得挺深的
    到了那后，我见到了许多之前没见过的事务，也经历了许多事，挺感谢他们的
    说一说，在那时上的幼儿园吧，叫蓝天幼儿园，页挺深刻的，在那里好像在记忆里挺开心的
    比较深刻的是在哪天中午午睡（那时幼儿园是有床午睡的），我和一个……就姑且称为同学吧，在玩橡皮泥，他在我的右上铺，他拿那橡皮泥搓成小球，向我扔，说起来他也挺厉害的，大部分都扔进我右耳，那天回家后因为头上都是橡皮泥，被母亲打了一顿，过了挺久吧，她给我挖耳赤时看见耳朵里的东西，赶紧跑到了医院，可终归过了挺久的，到现在听力也确实影响了一些
    哦，聊了挺多的体外话……
    
    —— 配乐：Awakenes Spirit / Dan Gibson
