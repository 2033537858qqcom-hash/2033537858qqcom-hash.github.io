    嗯……
    本来想睡的，可想起了中午或下午做的梦
    拿就讲一讲吧
    那个梦在刚醒时记得非常清楚
    并且在那个梦快结束时梦里自己的脑袋还想着这故事能写成一部小说
    但至于为什么没在醒后记下，忘了
    现在记得不大清楚了
    讲讲记得部分吧
    时间好像是在上学的时候好像是大学
    地点在一个中央花坛（忘记是不是圆形的还是心形的）
    天气只记得天有点黑有点灰
    人像我们部门的部长和一些穿着灰棕色西装的人（好像吧）
    开始什么的忘记了（但好像是我进入了什么好长时间了，想要逃出去）
    中间记得那几个人和我一起进了一个花坛旁类似假山中的一个洞（洞是圆形的类似隧道）
    走了一会儿那个洞变成了一个铁栅栏的隧道但周围是灰色透明的（我们说了什么，忘了）
    之后忘了
    最后出了洞还是什么的，那外面是一片雾，灰蒙蒙的，但右边像是矿车的轨道还是什么绳子
    然后忘了
    然后自己在类似鸟还是什么的上面，手里拿着一张牛皮纸，看了上面写了什么后，比较伤心和气
    然后后面就忘完了
    虽然讲的很少但做的梦真的是很长很长（自己大概10点多睡的，2点多醒的）
    醒来的非常舒服没想什么
    但现在想着就比较阴森还有种绝望的感觉
    嗯……刚才又想起了什么但又忘了
    无语🤦♀️
    就记得那么多，再眯一会吧
