- content: |
    今日气运不佳
    又一次 感性越过了理智
    也只有在深夜 才可慢慢复盘
    也只有在深夜 我才属于自己
    可能这就是命 永远指引一切
    我的前半生包括如今 好似一个玩笑
    就想那股市 那买越跌 也行下一步就是退市
    知晓越多 越发现自己渺小
    我也尝试同他们一样 可是人是独一无二的
    却学会欺凌 弱小 掌握他们
    我学的有模有样 正如之前 我又成了那般
    我想同蜉蝣一般体验精彩的一生
    可我不行 我只有驮着 壳 才会让我安心
    我喜爱这嘈杂的黑夜 赋予幻想 赋予平静
    我愧于黑夜 愧于世界 愧于自己
    我是那么自私 想要拥有一切
    ...
    晚安
    对不起
    
    —— 配乐：Some / Nils Frahm
  date: 2026-05-19 00:03:00
  tags:
    - 随笔
    - 夜
