- content: |
    身体上每天都很充实
    内心却很空虚
    每天忙碌的日子里我都是为了什么
    为了今天，为了明天，为了过去
    我时常焦虑
    焦虑伴我多载，因此我成了计划主义
    计划现在，计划每一种可能
    可计划在现实面前不堪一击
    我愈发的焦虑
    各种脾气在那时披露
    我开始进行补救
    就像那些计划一样弱不禁风
    我生气 我恼怒 我愧不成羞
    可到头来 我妥协了
    工作是工作，生活是生活
    我把生活过成了工作
    夜深了，脑中还在谋划着那可笑的计划
    窗外的雨声，风声
    一点一点揭露着一切
    也可能是感冒，竟悟到些许
    这一刻，就在这一刻
    ...
    
    —— 配乐：思い出 / 林ゆうき
  date: 2026-04-16 23:14:00
  tags:
    - 随笔
    - 雨
    - 夜
    - 配乐

- content: |
    熟悉的时间 不同的地点
    熟悉的歌曲 不同的想法
    来杭州快一个月了
    实习也有了一周
    这里充斥着一股向上的气息
    这里的人好像有着无限的活力
    这里好似到处都是礼仪
    每个人都在自己的路上跑着
    或快或慢 都在向着前方
    乐观或许就是根源
    我呢 也在向着前方
    无论好坏
    余香难蜕
    
    —— 配乐：Sleeping beauty / 出羽良彰
