- content: |
    又到了深夜
    雨在徬晚就停了
    夜很静
    －－－－
    之前我是像多数人不喜欢雨的
    一到雨时就坏了一天的情绪
    这其实是由许许多多的事引起
    但到了高中时期
    雨，貌似变成了常态
    那时是每日软绵绵的
    可我遇到了一位同学
    也是那天中午饭点已过
    正在回班路上
    一刹，倾盆大雨
    到了教室自然成了落汤鸡
    那位同学自然一样
    可她却欢快地说着雨天多好多好
    我不以为然
    雨好像在那一段时间成为了常客
    在小星期时（一周2个小时假期），我一人在教室（因为家长工作）思索着用白屏看些什么时
    风从窗穿了进来
    透过窗，向下看着
    她在小路上蹦蹦跳跳
    雨好似真的同她所说那般美好
    之后又发生了许多
    有好有坏
    在雨天，也是这般深夜，雨也渐停
    我们也结束了
    －－－－
    雨天
    多么安静
    世间的污秽都被雨水冲刷
    其实自己就是那个污秽
    只有在雨天
    才会将自己净化
    －－－－
    我会记住每个雨天
    无论好坏
    今天的雨同往常一般
    
    —— 配乐：Kiss The Rain / Yiruma
