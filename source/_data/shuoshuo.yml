    最终以我扫兴结束
    唱完歌发小带我们去了吃饭
    ……
    最终以他对我说，这样不行，以后怎么样也要让你出来，哪怕是转转
    本应丰富的一天
    自己在当时却没一丝……
    我向他们说过，我好像病了
    但……
    总感觉孤独……
    也总感觉自己好像快撑不住了
