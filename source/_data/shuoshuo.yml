- content: |
    怎么说呢，不说出来难受
    从此这就当我的日记或宣泄地了
    -------
    至于为什么，还不是因为又失眠了
    对，没错，因为我又醒了눈_눈
    挺尬的，哎，没办法
    ____________________2023.12.25哦，快26了
    今天好像也没什么事可拿出写的
    but，好像确实没什么
    快考试了，但心中没一点紧张，也许已经不是之前了，也许是之前的时政考试与心里面的差了许多，可能吧，挺难受的，however，更难受的事，数学考试在第19周，第19周，第19周，疯了疯了，真疯了，不是，我就想问要人死啊，还有两个星期，我要无聊死，本来还以为第18周就什么都干完了，还想出去玩呢，就算不出去玩，也可以干些什么，但干些什么呢？好吧，没想到，但是，19周还在考试，这就真……
    我是喜欢往长远的方向想，19周考完了，我是回家吗？，还是干些什么？是的，很迷茫，想了一下午，对的因为今天就两节课（数学讲的要考试的题，一共166个，自己看完了129道了，不是这数学也挺敷衍的，无语🤦♀️，就这几道题还要2周，无语    英语讲的也是题，对还有原题，但英汉互译，作文就很无语，多，真多，上课的心态也在慢慢变，是不如曾经了吗，是的，但现在完全没目标了，哎）下午，洗澡去了，那时候也是运气吧，高中生可能是小星期，也来洗澡了，那凿凿咋咋声音，嘻嘻哈哈，让我有些不适应（是的，我们这里还有高中生，他们在我们这有班级，上课），晚上，出去买饭回来，走到那路上（经过他们上课的那个院），闻到一股火药味，转头一看一听，一群高中生拿着响炮，摔炮追着另一群高中生“别跑”“哈哈哈哈”“弄他弄他”……哎
    回来吧，吃吃就拿起手机，刷了一会儿，没意思，闭屏，听会歌，可能是倦了吧，也可能是无聊，上床了
    醒来前，貌似醒来一次，之后，又做了梦，做了什么，忘了，没办法，但醒来就有一种空虚感，拿起手机，可想了想，又没什么意思，就闭上眼睛
    嗯的一声，微信响了，我弟跟我说了说他开始学网课了（终于开始学了，给他说了好久），然后我跟他聊了聊，理综90多，…… ……无语╮（╯＿╰）╭，真真，算了我也，哎，然后又说了说，他学去了
    我又拿起手机，拨了拨，看了看，欸？
    然后，今天就这样过去了，无趣
    只能说已经很不错了，又过了一天
    可，可，哎，就这吧，无趣的一天，无聊的一天，胡思乱想的一天，逝去的一天，可又有什么办法呢，没，就这吧，哎，无趣
