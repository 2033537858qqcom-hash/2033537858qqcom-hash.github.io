- content: |
    人 生来就要做些什么的 不是吗
    可要做些什么呢 不知道
    好像每时每刻都在活着
    "好好活着就是才可以做些什么
    好死不如赖活着..."
    生来要做些什么
    那么死去又失去什么
    美食 音乐 朋友 家人 风景
    ...所拥有的一切
    站在土地上  听着风的声音
    生于这土地  还于土地
    见证了变迁 见证了兴衰
    要做些什么呢  不知道
    找了棵树  拨拨树旁的土
    坐在那  望着树枝 还未出芽
    是否多年前 也有着
    同这般望着  想着什么
    可能是人 是虫 是石头 是土
    它们会做些什么呢  不知道
    但它们如今都不在这
    在这的只有我 还有这棵树 这片土地
    我们会做些什么呢  不知道
    
    —— 配乐：§ / Quadrant Shield Music
  date: 2026-03-14 00:09:00
  tags:
    - 随笔
    - 配乐

- content: |
    无所事事  结束一天的身体上的疲倦
    躺在床上  开始了总结脑子昏沉沉的
    披上外衣  感受风 站在中央 道不尽
    俯下身子  看那花 幼嫩新生 说不清
    ——————
    将近22年
    真正认知不过三四年罢
    在这段时间中 近乎改变自己的一切
    书本上种种 走进了现实
    同那生长纹 撕裂感充斥身体各处
    各种标签 贴满面颊 充斥回音
    ——————
    安逸正在杀死比赛
    焦虑获得各种助攻
    思考在无差别攻击
    ——————
    就这样吧
    
    —— 配乐：和更好的自己见面 / Siren
