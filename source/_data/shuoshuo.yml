    - 配乐
    - 长文

- content: |
    憋了很久，还是想写写
    他们都说沉默寡言，说的没错
    现实中的我，唯唯诺诺
    无论事件益或害
    短时间内情绪起伏不定
    我曾想阻止现象
    发现天方夜谭
    后来只能缓慢减少
    现实中的我，优柔寡断
    短事件，无法正确判断
    长事件，只会随着时间不断变化
    你一句，我一句，事件变得更加模糊
    所以此后啊，我学会了思考
    在脑中每一个想法都是思考
    他们是话剧中的小人
    一直叽叽喳喳个不停
    可自己却爱上了话剧
    同他们那般砸砸不停
    再后来啊，小人越来越多
    我和他们的互动越来越多
    可舞台就那么大
    于是他们跑下舞台坐在我身边
    在他们的怂恿下，我站在了舞台上演起了话剧
    我笑他们笑，我哭他们哭
    思考还在继续
    可我在舞台上太久，忘却如何停止
    就这样，我在舞台上筋疲力尽，可还是笑着
    现实的我越来越累，他们说是空想
    其实并没有“们”，也没有“他”，有的只是“它”
    它劝我少些思考，它没有讲着大道理
    也没有要求，只是引导另一种的思考
    可站在舞台上，就那么甘心下去吗
    我和它争论，它一句我一句，没有结果
    时不时小人还插一句
    我还是那个我，可我已经不是那个我了
    
    —— 配乐：Una Mattina / Ludovico Einaudi
  date: 2025-12-05 09:29:00
  tags:
    - 随笔
    - 夜
    - 配乐
    - 长文

- content: |
    也不知为何
    又失眠了
    最近
    看了一些，想了一些
    记了一些，忘了一些
    每个深夜，孤独都向我招手，今夜也不例外
    自己躺在窗帘中，周围黑黑的，静静的
    掀开一角，光刺入瞳孔，音传入耳洞
    我用尽力阻挡那一角
    光与声不断的炸来
    我怒气冲天
    拉开窗帘
    乌黑充斥一切
    气很快消去
    可恐惧却消磨不去
    我想孤独是什么味
    那应该是咖啡味吧
    饮过一口，便回味无穷
    
    —— 配乐：电影 / JINBAO
  date: 2025-11-20 01:20:00
  tags:
    - 随笔
    - 夜
    - 配乐

- content: |
    第一次还是疫情刚开始的时候
    当时初三，正直中考
    我们老班是一名政治老师
    身材有些雍胖，带着一副无框板镜
    叫什么已经忘却，可她那撇嘴吵我们的样子忘不了
    当歌 叮铃铃铃~时，就知道要要早读了
    顶着油脸拍了一张照片，拿起床头的书翻了翻，继续倒下 呼呼
    再次醒来已是饭点，家里忙忙碌碌，甚是有趣
    课上，寥寥几条弹幕，证明还有人在听着课
    那是好像都在想着 明天会更好
    应该是下学期吧
    校园的后楼层愈发的紧张了
    班中恰恰相反
    可能是班级的原因吧
    那时是我最欢乐的时光（仅次于高考前夕）
    当时还未将名字改回三字
    班中也正值一股社会气息（混的人多）
    我也夹杂他们之中
    可发现他们同常人一般，不过认知有些偏差
    他们比常人更加善良，就是多了些义气罢了
    我们一起欢声笑语
    丝毫不知道中考的到来
    只知道 明天会更好
    很快 高中开学了
    我完全不适应这种压力的生活（初中没有上过晚自习，在下午6点多就回家了）
    可遇见身边的同学与自己实力相当
    便要与他们争个一番
    想象很丰满现实很骨感
    我遇见了，说出直捣黄巢的他
    但我还不相信，只想着 明天会更好
    高中最后一次听到这首歌是高三的一个午休结束时间
    眯着疲惫的眼带，歌声结束，脑袋也清醒了很多
    在那一年我交到了良友，尽管最后被我弄的混浊一片
    我由衷的感谢他们
    在高考考试最后一刻，“考生停止答题...”
    我还在幻想着 明天会更好
    直到现在自己躺着寝室小床上
    为学习，为实习，为现在，为将来焦虑
    可人嘛总是会幻想的嘛
    说不定 明天会更好
    “轻轻敲响沉睡的心灵
    ...
    让我们期待明天会更好”
    
    —— 配乐：明天会更好 / 余天/李建复/洪荣宏/王梦麟/费玉清/齐秦/蔡琴/苏芮/潘越云/甄妮/林慧萍/王芷蕾/黄莺莺/陈淑桦/娃娃/李珮菁/齐豫/郑怡/江蕙/杨林
