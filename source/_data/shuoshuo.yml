- content: |
    也许失眠是常态
    也许伤感总在思索之后
    我享受着孤寂
    可也盼望着烟火
    我常常幻想若是自己能改变过去就会...
    可总在幻想后，又考虑许多，改变了又会怎样
    不过是更加完美了一些
    可若是没有那些，自己之后又会如何
    这或许是个循环
    可自己却喜欢“自投罗网”
    因此我喜欢想象
    更喜欢“梦”
    它不受着现实的规律
    却又符合现实的许多条条例例
    光怪陆离
    毫无逻辑
    意料之外
    ...
    这就是它迷人之处
    我上网搜过关于此的解释“喜欢做梦是一件很美好的事情。梦境让人感受到天马行空的自由，无论是对现实的补充，还是对未来的憧憬，都能让内心充满无限可能。做梦也是一种内在情感的表达，也许它是你和自己的独特对话方式。”
    是啊，我多么想拥有一个和自己一样的人，我说他听，他说我听，我们的心是连在一起，我们是单独也是整体，无话不谈
    可梦终会醒，于是我想尽一切延长梦，却不尽人意，梦醒了，失落感涌上心头
    又一个夜晚，梦又开始了，竟是与此之前的梦相连，可我在梦中，无法察觉，只是有种熟悉感，不久梦又醒了，可再无失落而是游意未绝，也许多年以后那个梦还会继续延续，只不过人已不是从前的那个人了
    
    —— 配乐：Finding It There / Goldmund
