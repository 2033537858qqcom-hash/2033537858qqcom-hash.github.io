- content: |
    忍了很久还是想说出来
    这是个故事
    有一名高三的男孩
    在开学时，要自己去找座位
    男孩嫌懒
    就让曾经的同学帮他占个座位
    在一番商量下，就占到左边
    第二天，开学了
    男孩早早进入了班级，一切都平平常常
    在一次上自习课时，男孩想问作业是什么
    就想问前面的女生
    这时同桌对他说了什么男孩也就没有问
    不久在一次晚自习吧，班级比较乱，男孩对此也没什么感觉，突然，前面一声静下来
    男孩也知道前面女孩好像是班长
    因为高二的缘故，男孩对班长之类的没什么好感
    便与女孩没什么交流
    高三时间过的很快
    没多久，第一次月考就结束了，那时是按成绩来挑选座位的，男孩考的还不错，并且坐在那还行，就没有换座位
    很快，座位在一次自习调好了
    男孩看了看周围没什么变化，也没想什么
    也不知道是什么时候开始男孩和女孩开始了聊天，开始了交流题目
    时间在慢慢的推移，可巧的是每次他们都坐为前后桌，并认识了许多新朋友，老同学，他们一起在小星期时看电影，一起为女孩过生日，他们在疫情快过年时又来到了学校，仿佛一切都那么美好
    转眼间，高考就要来临，男孩想赌一赌，在一次调座位时，他坐到了最后一排，他的朋友都不理解，可女孩因他的离开有些难过
    过了没多久，女孩也借着困和问题的理由也来到最后一排，那时班中也好似掀起了最后一排的浪潮，毕竟快高考了就有许多同学开始问题，女孩也不例外，可她好像高估了男孩，她问的题男孩大多数都不能解决，还有的就是很简单的题，男孩可能那时有点生气了，也可能是被受挫折，男孩不在想和女孩聊天，可终归是同学
    到了最后一个月，男孩堕落了，他不再认真学习，女孩同之前一样认真
    到了毕业典礼，那天下着大雨，男孩与同学一起在玩手机，而女孩却在雨中玩耍，无数气球在空中飘着，男孩在想要结束了，这时女孩拿着一排气球说给你，男孩愣了愣，虽有些不情愿，可还是拿到了手里，可在最后结束的时候，男孩急着回家忘记什么，在快到校门口时，女孩追了上来，她手上缠着一排气球，可男孩看见她脸上的眼泪，女孩用着哭腔说你你为什么不等我，为什么不拿着气球，男孩说了些什么，女孩又说了什么，男孩缠着气球回到了家中
    高考结束了，男孩运气似乎比平时差了许多，女孩在一次聊天中把男孩叫出来一起看电影，男孩也把那准备已久的礼物拿了出来
    ……
    最后男孩和女孩由于男孩伤了女孩，没有在一起
