- content: |
    还是睡不着
    那我就模仿一下《十日终焉》里的一段吧
    __________
    我叫李，
    平时i人一个，没什么朋友，透明是我的标签，可最近也不知道怎么回事，身边人多了起来，哦，原来是要中考了，可身边人为什么会多了起来，瞧我这记性，最近，成绩还可以，怎么说也是上面班下来的，不过是玩了半年，家长为什么那么急呢？谁知道呢？不过，身边人多了，感觉浑身不自在，真想一个人，“哎，你是李吗？”我狐疑看了看“嗯”，“我想问道题可以吗？”我说是什么，原来是来问题的，可为什么是我？我拿起笔紧紧张张教完了，应该是教完了，嗯，可能吧，我放下了笔，急忙走向了厕所，“怪，怪怪”
    “运气不好”，我出去了，几天后，身边人又多了起来，老师在一次课上说要向我学习，嗯？怪，可别人也只是问问题，慢慢的我好像变了一个人，我不再畏缩不前，我开始了上台教学，那感觉就好像好像获得了志高无上的荣誉，可，直到，距离中考的前3个月，那个女生O出现了，她仿佛突然降临，是的，那时我哪有抵制力，正值青春，是的我被迷住了，我教祂听，祂问我说，一切都是那么美好，中考结束了，我准备好了一切，就等待着机会，可在那时一些事传到耳中，我丧失了理智，忘却了一切，我做了许多事，并非益事，正当我还要继续行动时，感到地面摇晃，地面裂开了一道巨大的缝，那裂缝漫到我身边，我用尽力气跑，可那终归太快了，我昏迷了过去，等我醒来，我看见周围有八个人，我想动，可双腿却没任何力气，突然一个戴着羊面具的人直接杀了旁边的人，说了一个“说谎的人”游戏，我翻开了我的牌“说谎者”，哦，是呀，我有罪，所以来到了这，所以 我叫李，我要开始说谎了
    -----------“你说你喜欢小丑吗？”
    深夜，总是能激发各种想象力，可，那想象也必须来自现实，我并非有哪些“生生不息”，更不是“回响者”，我只是一个参与者，“赌命”是重开手段，可兔子急了也会咬人，你敢赌吗？
    //）
    只是所感所想
    没什么意思，当然也可能吧
    只是练练手，，宣泄一下，就这样吧
    也要睡了
    ∑(￣□￣)
