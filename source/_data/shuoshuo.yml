- content: |
    读后有感
    今天下午没课，又恰巧未眠
    就啃起了收藏已久的书
    起初被推荐
    只是被名气所引
    可读完，名至而归
    故事很简单
    不过是拯救世界的故事
    先不谈结局
    至少在逻辑方面是一流
    开始即是结束，人类没能幸存
    有人说，是人类自己害了自己（有几种猜想：
    1.同感，人类经过那么多的努力来杀死刀客，也害了自己，刀客不属于三维，在那个房间里，当通过像头时，它们就已经注意到了当时的人类，由于黄大爷没能将信息传输给母机，可在引爆核弹之时，刀客的注视时长极大可能传给了母机
    2.在引爆核弹后，出现了stop vvvlbi ，但在之前之时，已经说过vvvlbi已经建成，既然建成，就证明已经经过测试，证明已经完成了双向的信息交流，刀客已经注意到了人类）
    读完感触最深的：
    这就是个循环，连翘是半夏的老师，从种种方面都可以得出：
    1.老师在白杨家的周围建立了所谓的庇护所
    2.老师的身手很好，在只有一把匕首的情况下，刺瞎了老虎的一只眼睛
    3.老师知晓各个领域
    4.那枚硬币
    至于连翘为什么在已知未来的情况下仍收留半夏，
    1.从最后面“白杨抬手揪住自己的头发，他大脑深处忽然抽动似地隐隐疼痛，低声说：“我对大小姐负责？”
    　　“嗯……这么说也没问题，你确实是对她负责……”连翘点点头
    ”还有送硬币等
    2.连翘在了解末日后知道了真相，就把自己所推断的情况全部烧掉，不让半夏知道是因为她导致的末日
    当然以上只是我自己的见解
    书并不是那种读完就感觉震撼的，而是需要细品，仔细一回味，感触颇深
    书中也有自以为的bug
    1.那面派大星的墙到底是因为什么被抹除了
    2.白杨一家在最后是否逃进了老家的地下
    3.半夏最后说的一定会见面，是否因天猫精灵有着后手
    4.老师的机械改造是因为什么
    哈哈哈，知道又有什么用呢
                                      书名《我们生活在南京》
    
    —— 配乐：一生有你 / 水木年华
