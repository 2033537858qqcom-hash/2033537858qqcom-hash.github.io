    机课上，侧靠墙边
    恰巧一阵风透过窗
    吹在身上
    消除了前几天的燥热
    本是课上，却一丝专注也无
    有一阵风吹来
    吹的竟有些刺骨
    5月的风竟还有这般威力
    我透窗望去
    成群结队，一身黑，蹦蹦跳跳
    嘻嘻哈哈，你追我，欢声一片
    ...
    这般美好
    可也知，不久后，那一群黑
    天南地北
    这会儿，竟那样入迷
    不由的发散到自己
    明年呢
    自己会不会同他们那样
    我认为会的
    因为这就是青春，它不会缺席
    但之后呢
    我又想了很多
    可无论多少，都会有离时的伤感
