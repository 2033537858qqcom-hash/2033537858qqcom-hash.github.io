- content: |
    没人会喜欢糟糕的一切
    当适应了糟糕，一阵暖风吹过，也会泪流不止
    因此我怕极了
    我马上就能逃出这里
    谩骂 指责 殴打
    遍体鳞伤后它又拿着软糖说教着
    我连马戏团的猴子都不如
    但是我马上就能逃离这里
    我望着惨白灯泡 又看向地上头发
    鼻子一酸 又不争气了
    要吃饭了 拿纸摸住眼睛鼻子
    打着哈欠 若无其事吃着饭
    餐桌上它又开始讲述桌酒文化
    脸望着碗里汤 耳边又传来恶心声音
    就想碗里那块肉样 胃里翻涌着
    又回到了那个房间
    正数着还有几天结束
    一天 两天 三天...
    
    —— 配乐：In Love / July
  date: 2026-02-28 20:22:00
  tags:
    - 随笔
    - 配乐

- content: |
    夜里 雨不期而至
    雨滴打在不锈钢的窗架 哒哒哒哒
    像极了儿时雨天在瓦房下的声音
    说起雨
    手机中竟只有寥寥几张
    我是一个爱拍照的人
    雨是平静的 它总是悄悄的显现
    北方的雨 集中在春秋
    而那时的我 却一直沉沦于乏困
    也可能是儿时整日整夜雨天的乏惫
    雨是温柔的 它总是紧紧的拥抱
    南方的雨 猜摸不透
    但潮湿 一直弥漫在空气中
    哒哒哒的声音又变大了
    就好似之前 对 就是之前
    “盼望着，盼望着，春天来了...雨是最寻常的...”
    雨是记忆的 它总用不同方式存储时间
    雨好似总在夜里 诉说一切 滔滔不绝
    我倾听着 思考着
    可能是故事太过传奇 我竟陷了进去
    再次晃动脑袋时 这次的故事告了段落
    雨 是水 是风 是开幕式 是落幕曲
    雨 又紧紧的拥抱我 开始了新的故事
    
    —— 配乐：rain / ねこぼーろ
  date: 2026-02-25 23:16:00
  tags:
