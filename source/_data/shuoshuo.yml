- content: |
    想了很多 还是写不出那种感受
    已经极力让自己真正放松
    脑海中总是闪过许多
    心跳的很快  总是担心一些事情
    也知道担心是多余的
    但就是放不下
    杞人忧天  我的呼吸紊乱
    泪腺也在摇拽
    随着音乐节奏  脑海又浮起许多未知
    如果是一个白痴多好
    只要有吃有喝  无忧无虑
    如果活着梦里多好
    无论好坏多少  不会永远如此
    现实  心跳的还是很快
    各种事情 压力 痛苦  还附在周围
    我什么都无法改变
    唯一只有不断祷告
    可我还有未来吗
    夜深了  周围只有心跳与蝉鸣
    望着天花板
    盼望着给出答案
    ...
    
    —— 配乐：本当の優しさとは… / 渡辺俊幸
  date: 2026-07-09 22:57:00
