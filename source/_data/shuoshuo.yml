- content: |
    多日之后，又想说些什么
    可能是近些天作息还未调整正常
    竟少了多份思考
    也不算是丧失，就是懒惰占了大多数
    疲惫与思索一同来到
    结果就是写了许多又删除
    当真正想继续写时，疲惫占据了一切
    可删完一切后，又后悔不已
    情绪总是填充着一切
    理性永远占不上上风
    总想着利用过去美好来麻痹自己
    与之而来的还有无尽的悔恨，不甘，痛楚
    我真的来到了绝境
    泪水，哽咽，颤抖...
    我充满了失望，对自己，对世界，对世间的种种
    我痛恨自己，无论过去，现在，未来
    一切的幸运，美好，幸福都不过是痛楚的前奏
    脑子翁翁，身体瘫软在床上
    望着天花板，黑黑的
    思绪也沉沦进去，幻想着一切
    只有肉体裸露在光下，呈现着那身丑陋的躯体
    随着温度的升高，散发着阵阵恶臭
    南无阿弥陀佛，南无阿弥陀佛
    我应该怎么办
    命也时也运也该也
    又要到了新的一年
    我还是那个沉沦的我  且越陷越深
    😮💨
    
    —— 配乐：Last Smile (extension mix) / LOVE PSYCHEDELICO
  date: 2026-02-14 22:53:00
  tags:
    - 随笔
    - 配乐
    - 长文

- content: |
    春风若有怜花意可否许我再少年
    是什么时候意识到自己不再是少年
    可能是一次次开智
    可能是更晚的睡眠
    可能是思想上的不断改变
    是的，可能远远不止如此
    我不止百次的路过校门口
    那百千次都是厌恶
    后来啊，我又一次路过
    它变得更新了，多了些嫣红涂料
    那木制的警示牌，也成了不锈钢
    我站在门前，就同千百次般那样站着
    不同的是，我不在拥有曾经的那颗心
    那颗一往无前的心
    如今在心的位置只有一个老鼠洞，里面藏着老弱病残
    天还是那般寒冷，风从衣下穿来
    我揣着兜，紧紧围着衣角
    周围没有什么变化
    还是那么清淡，我跺着脚走到对面
    透过栅栏，嘿，还是那样
    不过里面好像又多了一栋，也不知是什么
    呼~真冷啊，**学校竟然不放假...
    唉，正所谓，地球不爆炸，我们不放假...
    旁边的人逐渐多了起来
    不一会儿，好似热闹
    我穿梭在各个小摊旁，闻着香味，听着三五两群
    叽叽喳喳
    ...
    又一阵冷风刮来
    身边的人，只有零星几个
    不一会儿，又成了冷清
    我跟着最后几个人，看着他们都进到了栅栏
    那里的人更似热闹，我也想进去
    可门却拦住了我
    我道：我曾进去千百次，为什么不让我进
    门并没有打开
    风渐渐的大了起来
    在回去的路上，也不知谁哼了句
    我也迈着步子跟着哼了起来
    草原最美的花，火红的萨日朗...
    后来啊，我了解到，里面里的人都好像想要出去
    
    —— 配乐：Cold Winter / July
