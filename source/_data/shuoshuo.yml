- content: |
    我总是想说些什么
    在写之前就想到了所有事情
    当写时又无处落笔
    既然如此，那就写写自己吧
    性格内向由始至今
    不知是先天亦或后天
    但这注定了孤僻的一生
    小时如此现在如此
    我不懂
    我害怕陌生的一切事物，他们说这是人类的本性
    我信以为真，将自己牢牢束缚在铁床上
    我所在的那个房间阴暗潮湿，毒虫遍布
    我闭着眼说着违心的话，得到狱长赏识
    我好似一个优秀的艺术品
    狱长们总以我为例，处罚其余犯人
    我不懂
    我渐渐接受了事物，可身体却一直颤抖
    我不断摇晃身体，好似要夺回一切
    咆哮，辱骂，干吼...
    我再次醒来
    房间早已生锈，爬墙虎缠绕着一切，包括我
    我不懂
    铁床锈烂，那束缚四肢的枷锁旁血迹斑斑
    我扭动了一下
    只听到那嘎吱声，铁床折成数块
    我躺在爬墙虎上，贪婪的吸吮着绿色的气息
    光恰巧照到我的脑袋
    那里有着一块块灰色的树枝，一圈又一圈
    我不懂
    光为何那么巧
    我以爬墙虎为支撑，不断蠕动
    掉漆的门前绿色少了很多
    我想要站起却发现早已没了下半身
    我想要吼叫却发不出声
    原来啊我只是一棵树
    是吗，也有可能是爬墙虎
    是吗
    我不知道
    
    —— 配乐：ヽ｀ヽ｀、ヽ｀ / 沙皮
  date: 2026-01-19 01:05:00
  tags:
    - 随笔
    - 配乐
    - 长文

- content: |
    心中空空的
    脑袋也是
    也不知道怎的，大脑迟钝了许多
    从之前的思考慢慢转向了思索
    现在思索也渐渐稀少了许多
    是对生活的看法变了？
    还是自己已经丧失思考能力
    我不懂
    从前自己嘴边总嘟囔着
    好无聊啊，要是世界毁灭了该多有意思啊
    现在呢
    不知道
    好像变成了一具尸体，只有身体在活着
    骗你的，其实身体只有一副骨架，嘎吱的摇晃
    我不懂哎
    我貌似已经丧失了敬畏之心
    也不能说是丧失吧
    好像从来没有过
    可是之前不是这样的啊
    我难道变了，我不知道哎
    我变得好像大大条条的
    可是我越发的软弱
    甚至感觉自己得了幻想症
    真是无药可救了
    不仅如此我愈发冷漠
    骗你的其实我还失眠
    艹
    
    —— 配乐：Sleeping beauty / 出羽良彰
  date: 2026-01-18 01:31:00
  tags:
    - 随笔
    - 夜
    - 配乐

- content: |
    又到了新的一年
    回顾上年，只能说是成长了许多
    见到了心心念念的海
    有了努力的基本方向
    受到了家人的思想与行为的冲击
    明白了自己处于何种情况
    那一年是无趣的
    每日都在幻想与悲痛中度过
    我好久没有享受过快乐了
    我常常思索过去的欢乐
    企图吸吮遗留下的遗液
    可并没有，哪怕是一缕气味
    我变得暴怒不已
    我将自己的心撕开一块
    我尽力想要隐藏着一切
    可当洪流经过之时
    才发现一切都是徒劳
    我将我所认为的一切全部泄出
    冲向了我最亲近的人
    我病了，当说出一切的时候
    他们并不认为
    我也不相信
    可365个日日夜夜后，我妥协了
    那一年，我很疲惫
    既有心理上的，也有身体上的
    那一年，我痛哭过多次
    我的心也在那几次得到了死亡
    那一年，我想过很多次死亡
    我想死亡也许会让自己的人生有意义
    也不知道怎的，没有一次实行
    也许就是懦弱吧
    他们都说爱你老己
    可我真的不爱，我讨厌他
    他总是哔哔赖赖，他总是看着别人的言行
    他害怕孤独，又害怕热闹
    他真是个畜牲啊
    哪有人这样啊
    ...
    新的一年开始了，我和他又会变的什么样
    只有天知道
    
    —— 配乐：Windy Hill / 羽肿
  date: 2026-01-08 16:03:00
  tags:
    - 随笔
    - 夜
    - 配乐
    - 长文

- content: |
    幽静的旋律裹住双耳
    思绪回到了那个时候
    也同现在般，正值中午午休
    趴在桌上，用着校服垫着
    胳膊时不时翻动，试图找到舒服位置
    双脚也是如此，不过总是碰到地上的书框
    不知是天气变冷，还是怎的，久久未眠
    便缓缓直起腰，想要完成点卷子
    刚翻找到，便有一阵凉意袭来
    顺着风的方向望去
    楼下那片光秃树林增添了几分白意
    我把校服披在身上，感觉暖和了许多
    困意再次袭来
    几番挣扎下，索性继续睡觉
    胳膊放在试卷上，有着摩擦声
    可就是这样，距午休结束还有5分钟，睡着了
    迷迷糊糊好像做了一个梦
    梦里自己在雪中和同学嬉戏打闹
    你追我赶，追着追着下一幕突然变成了自己写着试卷
    卷上的题目模模糊糊，抬头看见马上要收卷了
    ...
    醒来后，心还在咚咚咚的跳着
    抬头向前望去，才过了3分钟
    我拿起抽屉的笔，准备开始些什么
    突然注意到了前些排学习的样子
    我放下了手中的笔
    我想他们脑中都在想些什么呢
    “你将来想当什么？”
    “嗯...我想建设祖国的大好江山”
    “这个专业好像现在不太好啊”
    “...”
    “我想当一名幼师，...”
    “我想当一名医生，...”
    “我喜欢小动物，...”
    “谁知道呢，还不一定能考上呢...”
    “你呢？”
    叮叮叮，午休结束了
    光一闪一暗，那白意也一闪一暗
    “哎，别发呆啊，那你呢？”
    “我不知道，...”
    
    —— 配乐：あなたと一緒に夏を過ごしたい / 春野杉卉
  date: 2025-12-14 14:10:00
  tags:
    - 随笔
    - 梦
