- content: |
    嗯……
    无聊缘于动力不足
    可这也没发
    ________2023.12.27一名clown一天
    今天微冷，无趣，可终有点意思，但不多
    是的，不多
    今天干了什么，干了许多，又好像没干什么
    差在，英语在19周考试，语文要考两次
    又一本小说见底
    好在，英语在19周考试，今天又要过去
    人不能闲着，就好比me
    可me却没找到自己喜爱之事，我也努力在找
    说喜欢听歌，却耐不过3小时
    说喜欢看书，却耐不过平淡
    说喜欢游戏，却耐不过规律
    说喜欢绘画，却耐不过动手
    说喜欢洽谈，却耐不过第一句话
    说喜欢睡觉，却耐不过平静与喧哗
    说喜欢新鲜，却耐不过等待
    说喜欢……
    是的，自己如此，想要改变些什么，可在行动前总会想尽后果，各种结局，想着想着便产生怀疑，明明弊大于利，为什么要去这样呢？是呀，为什么呢？不知道，但也就是这样，人不就停下车了吗？是呀，避免了弊，多好啊，可，在静下来时，最多的也思考过去，多思不好吗？不好，那时的某某事我怎么做的，我是不是语气有问题，别人是不是会对自己有意见，我是不是做的不对，后悔了，我之后应该怎么办，我应该怎么道歉，别人又能否接受，之前要做的事忘记做了，为什么会忘，之前的计划又是什么，之前与自己现在又有什么不同，自己又错过了什么，又欠了他人什么……
    可想到最后只有迷茫，自己也不知道，人啊，不能闲着，可自己又是这样
    ---------“你说，我还可以……吗？”
    距2024年还有4天，可自己2023又做了什么
    回想起来，也真的没那么美好，可也确实有那么美好的，
    由家庭的纷争到和睦荣荣
    由……到……
    由同学的相聚到离开
    由高中到大学
    由众人到独自一人
    由紧张到轻松
    由单一生活到多姿多彩
    由……
    不管怎样这一年过与得站着七三比
    又是一天要过去了，希望早睡早起
    听，外面在放烟花
    看，外面烟炮声“破 ~碰~”
    新的一年又要到了，可能会不一样(_ _)
    嗯吧/
    
    —— 配乐：泥巴 / 乔浚丞
