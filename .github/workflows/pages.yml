name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Optimize image assets
        run: pnpm run optimize:assets

      - name: Build site
        run: pnpm run build

      - name: Smoke checks
        run: |
          test -f public/index.html
          grep -q 'fab fa-weixin' public/index.html
          grep -q 'wechat-contact.js' public/index.html
          grep -q 'cursor-enhance.js?v=1.5.3' public/index.html
          grep -q 'custom.css?v=1.5.3' public/index.html
          # hidden 文不进首页主列表（侧栏也不应再挂出建站手记 slug）
          ! grep -q 'blog-setup-notes' public/index.html
          ! grep -q 'butterfly-page-structure' public/index.html
          grep -q '这里写些什么' public/index.html || grep -q 'what-i-write-here' public/index.html || grep -q '这里写些什么' public/2026/07/22/what-i-write-here/index.html
          test -f public/moments/index.html
          test -f public/music/index.html
          # RSS / 搜索不含 hidden 文
          ! grep -q 'blog-setup-notes' public/atom.xml
          ! grep -q 'blog-setup-notes' public/search.xml
          test -f public/img/favicon.ico

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
