name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        env:
          COREPACK_ENABLE_STRICT: 0
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
        run: |
          corepack disable || true
          node -v
          command -v pnpm
          pnpm -v
          pnpm install --frozen-lockfile

      - name: Optimize image assets
        run: pnpm run optimize:assets

      - name: Build site
        run: pnpm run build

      - name: Smoke checks
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test -f public/index.html
          grep -q 'fab fa-weixin' public/index.html
          grep -q 'wechat-contact.js' public/index.html
          grep -q "cursor-enhance.js?v=${VERSION}" public/index.html
          grep -q "custom.css?v=${VERSION}" public/index.html
          ! grep -q 'html:not(.site-loaded) body' public/index.html
          # hidden posts must not appear on home / sidebar
          ! grep -q 'blog-setup-notes' public/index.html
          ! grep -q 'butterfly-page-structure' public/index.html
          ! grep -q 'anime-page-plan' public/index.html
          grep -q 'home-now' public/index.html
          grep -q 'what-i-write-here' public/index.html || grep -q 'what-i-write-here' public/2026/07/22/what-i-write-here/index.html
          test -f public/moments/index.html
          grep -q 'moments-years.js' public/moments/index.html
          test -f public/js/moments-years.js
          test -f public/music/index.html
          # photography page must list cards from source/img/photography
          test -f public/photography/index.html
          grep -q 'class="photo-card"' public/photography/index.html
          grep -q 'photo-year' public/photography/index.html
          grep -q '/img/photography/' public/photography/index.html
          ! grep -q '<!-- photo-list -->' public/photography/index.html
          ! grep -q 'month-filter' public/photography/index.html
          # RSS / search should not list hidden posts
          ! grep -q 'blog-setup-notes' public/atom.xml
          ! grep -q 'blog-setup-notes' public/search.xml
          test -f public/img/favicon.ico
          # related posts must not recommend hidden notes
          ! grep -q 'blog-setup-notes' public/2026/07/22/what-i-write-here/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
